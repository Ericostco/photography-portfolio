<!DOCTYPE html>
<html lang='zh-TW'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>我的攝影作品</title>
    <link rel="icon" type="image/x-icon" href="img/title-icon.svg">
    <meta name='description' content='我的攝影作品集，展示各種攝影風格和主題'>
    <meta name='keywords' content='攝影, 作品集, 攝影風格, 旅遊攝影, 自然攝影'>
    <meta name='author' content='BO GUEI CHEN'>

    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css' rel='stylesheet'
        integrity='sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT' crossorigin='anonymous'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel='stylesheet' href='./style/style.css' />
</head>

<body>
    <header class="d-flex justify-content-between align-items-center p-3 shadow-sm">
        <div class="d-flex align-items-center">
            <img src="/img/header-icon.svg" alt="網站圖示" width="40" height="40" class="me-2">
            <h1 class="fs-4 fw-bold">我的攝影作品</h1>
        </div>
        <nav>
            <ul class="nav">
                <li class="nav-item"><a class="nav-link active" href="#">首頁</a></li>
                <li class="nav-item"><a class="nav-link" href="#">熱門景點</a></li>
                <li class="nav-item"><a class="nav-link" href="#">主題旅遊</a></li>
                <li class="nav-item"><a class="nav-link" href="#">聯絡我們</a></li>
            </ul>
        </nav>
        <div class="theme-switch ms-3">
            <input type="checkbox" id="darkModeSwitch" class="theme-switch-input">
            <label for="darkModeSwitch" class="theme-switch-label" title="切換深色模式">
                <i class="fa fa-moon"></i>
            </label>
        </div>
    </header>

    <main>
        <section id="mainCarousel" class="carousel slide" data-bs-ride="carousel" style="z-index: 1;">
            <section class="carousel-inner">
                <section class="carousel-item active">
                    <section class="position-relative">
                        <img src="img/1.jpg" class="d-block w-100" alt="旅遊圖片1"
                            style="height: 45rem; object-fit: cover;">
                        <span class="watermark position-absolute bottom-0 end-0 m-3">BO GUEI CHEN</span>
                    </section>
                </section>
                <section class="carousel-item">
                    <section class="position-relative">
                        <img src="img/2.jpg" class="d-block w-100" alt="旅遊圖片2"
                            style="height: 45rem; object-fit: cover;">
                        <span class="watermark position-absolute bottom-0 end-0 m-3">BO GUEI CHEN</span>
                    </section>
                </section>
                <section class="carousel-item">
                    <section class="position-relative">
                        <img src="img/3.jpg" class="d-block w-100" alt="旅遊圖片3"
                            style="height: 45rem; object-fit: cover;">
                        <span class="watermark position-absolute bottom-0 end-0 m-3">BO GUEI CHEN</span>
                    </section>
                </section>
                <section class="carousel-item">
                    <section class="position-relative">
                        <img src="img/4.jpg" class="d-block w-100" alt="旅遊圖片4"
                            style="height: 45rem; object-fit: cover;">
                        <span class="watermark position-absolute bottom-0 end-0 m-3">BO GUEI CHEN</span>
                    </section>
                </section>
                <section class="carousel-item">
                    <section class="position-relative">
                        <img src="img/5.jpg" class="d-block w-100" alt="旅遊圖片5"
                            style="height: 45rem; object-fit: cover;">
                        <span class="watermark position-absolute bottom-0 end-0 m-3">BO GUEI CHEN</span>
                    </section>
                </section>
                <section class="carousel-item">
                    <section class="position-relative">
                        <img src="img/6.jpg" class="d-block w-100" alt="旅遊圖片6"
                            style="height: 45rem; object-fit: cover;">
                        <span class="watermark position-absolute bottom-0 end-0 m-3">BO GUEI CHEN</span>
                    </section>
                </section>
            </section>
            <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </section>

        <section class="container py-5 photo-theme-items">
            <h2 class="text-center mb-4">攝影主題</h2>
            <div class="row justify-content-center g-4">
                <div class="col-6 col-md-3 text-center photo-theme-item">
                    <img title="自然風光" src="img/1.jpg" class="rounded-circle mb-2" alt="主題1" width="120" height="120"
                        style="object-fit: cover;">
                    <div>自然風光</div>
                </div>
                <div class="col-6 col-md-3 text-center photo-theme-item">
                    <img title="祭典節慶" src="img/2.jpg" class="rounded-circle mb-2" alt="主題2" width="120" height="120"
                        style="object-fit: cover;">
                    <div>祭典節慶</div>
                </div>
                <div class="col-6 col-md-3 text-center photo-theme-item">
                    <img title="文化風韻" src="img/3.jpg" class="rounded-circle mb-2" alt="主題3" width="120" height="120"
                        style="object-fit: cover;">
                    <div>文化風韻</div>
                </div>
                <div class="col-6 col-md-3 text-center photo-theme-item">
                    <img title="歷史建築" src="img/4.jpg" class="rounded-circle mb-2" alt="主題4" width="120" height="120"
                        style="object-fit: cover;">
                    <div>歷史建築</div>
                </div>
            </div>
        </section>
    </main>

    <section class="fixed-background-image"></section>

    <section class="google-map">
        <h3>我的旅遊地圖</h3>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3747610.310470868!2d116.85900810574577!3d23.468554152101795!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346ef3065c07572f%3A0xe711f004bf9c5469!2z5Y-w54Gj!5e0!3m2!1szh-TW!2stw!4v1749312633983!5m2!1szh-TW!2stw"
            allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>

    <footer>
        <section>
            <p>© 2025 我的攝影作品. All rights reserved.</p>
        </section>
    </footer>

    <script src="script.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js'
        integrity='sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO'
        crossorigin='anonymous'></script>
</body>

</html>
